rgy required to remove the least bound electron from the surface of the conductor."], "sec": "ST"}, {"id": "NS2", "m": 1, "q": "Define the stopping voltage.", "b": ["The stopping voltage of a photocell is the minimum potential difference required to prevent the most energetic electron emitted from the cathode from reaching the anode."], "sec": "ST"}, {"id": "NS3", "m": 1, "q": "State why it is important to minimise patient exposure time.", "b": ["Exposure time should be minimised to limit exposure to ionising radiation which can damage living tissue in large doses."], "sec": "ST"}, {"id": "NS4", "m": 1, "q": "Define attenuation in the context of X-rays.", "b": ["Attenuation is a decrease in the intensity of X-rays, through scattering and absorption that occurs when X-rays penetrate matter."], "sec": "ST"}, {"id": "NS5", "m": 1, "q": "State why the atoms on the surface of the crystal in the Davisson-Germer experiment are classified as coherent wave sources.", "b": ["The atoms reflect electron waves that maintain a constant phase relationship as they travel towards the detector."], "sec": "ST"}, {"id": "NS6", "m": 1, "q": "State the property of electrons that allows them to be focused in an electron microscope.", "b": ["Their charge enables forces from electric and magnetic fields to bend their path appropriately to keep them focused."], "sec": "ST"}, {"id": "OE1", "m": 2, "q": "Describe and explain the formation of a light spectrum from an incandescent light source.", "b": ["The atoms in the filament vibrate with a continuous range of frequencies, including those corresponding to visible light.", "Thus, all visible light frequencies are emitted by the filament, which produces a continuous spectrum of light."], "sec": "SA"}, {"id": "OE2", "m": 2, "q": "Describe and explain the changes in the spectrum of an incandescent source as the temperature of the source increases.", "b": ["As the temperature increases, the average vibrational kinetic energy of the atoms in the filament increases, which results in photons of greater frequencies being emitted. Also, the dominant frequency increases so the dominant wavelength is 1 reduced as 𝜆 ∝ . 𝑓", "Furthermore, photons are emitted at a greater rate, so the intensity (brightness) of the spectrum increases."], "sec": "SA"}, {"id": "OE3", "m": 2, "q": "Describe and explain the formation of a line emission spectrum.", "b": ["Electrons in hot, excited gas atoms transition from higher to lower energy levels, emitting a photon with energy equal to the difference in energy levels.", "Since there are discrete energy levels, atoms emit photons of specific discrete wavelengths, resulting in spectral lines corresponding to these wavelengths, and dark regions everywhere else."], "sec": "SA"}, {"id": "OE4", "m": 2, "q": "Explain how the uniqueness of the spectra of elements can be used to identify the presence of an element.", "b": ["The wavelengths of spectral lines correspond to photons with energy equal to the difference between two energy levels of an atom. As elements have unique electron configurations, these differences vary for each element, resulting in unique line emission spectra.", "The line emission spectrum of a mixture has all spectral lines of every individual element in the mixture. Hence, if all the spectral lines of an element are in the line emission spectrum of a mixture, then the element is in the mixture."], "sec": "SA"}, {"id": "OE5", "m": 2, "q": "Explain how the presence of discrete frequencies in line emission spectra provides evidence for the existence of states with discrete electron energies.", "b": ["The presence of spectral lines at discrete frequencies indicates the emission of photons of discrete frequencies and hence discrete energies (𝐸 = ℎ𝑓).", "The energy of an emitted photon is the difference of the energy levels that an electron transitions between. Thus, discrete energies indicate discrete energy transitions, and thus discrete energy levels in which electrons may exist and transition between."], "sec": "SA"}, {"id": "OE6", "m": 3, "q": "Explain the production of characteristic X-rays in an X-ray tube and hence explain the characteristic peaks of the X-ray spectrum.", "b": ["When high energy electrons collide with inner shell electrons in target atoms, they are ionised, removing the inner shell electron from the atom.", "This makes the atom unstable, causing an electron transition from a higher energy level to the energy level of the removed electron. This results in the emission of an X-ray photon with energy equal to the difference of the energy levels.", "This is known as a characteristic X-ray which has a characteristic frequency. Since there are discrete characteristic frequencies due to discrete energy transitions within the atom, there are intensity peaks at these frequencies."], "sec": "SA"}, {"id": "OE7", "m": 2, "q": "Explain the difference between excitation and ionisation.", "b": ["Excitation is when a ground-state atom absorbs energy equal to the difference of two energy levels, causing an electron to transition from the lower energy level to the higher energy level.", "Ionisation is when an atom absorbs enough energy for an electron to be completely removed from the atom, leaving a positively charged ion."], "sec": "SA"}, {"id": "OE8", "m": 3, "q": "Describe and explain the formation of a line absorption spectrum.", "b": ["When white light passes through a cool gas, electrons in the gas atoms transition from lower to higher energy levels, by absorbing a photon with energy equal to the difference in energy levels.", "These excited atoms soon return to their original state, spontaneously emitting a photon of the same wavelength in a random direction. Thus, very little light of absorbed wavelengths reaches the screen.", "Since there are discrete energy levels, atoms absorb photons of specific discrete wavelengths, resulting in dark lines corresponding to these wavelengths, and continuous spectra everywhere else."], "sec": "SA"}, {"id": "OE9", "m": 2, "q": "Explain why there are no visible absorption lines in the visible region for hydrogen at room temperature.", "b": ["At room temperature, hydrogen atoms are in ground state.", "Only transitions from n=2 to a higher energy level result in the absorption of a photon of visible light. Since there are no transitions from n=2 at room temperature, there are no visible absorption lines."], "sec": "SA"}, {"id": "OE10", "m": 3, "q": "Explain the presence of absorption lines (Fraunhofer lines) in the Sun’s spectrum.", "b": ["When the continuous spectrum emitted by the Sun passes through cool gases, electrons in the gas atoms transition from lower to higher energy levels, by absorbing a photon with energy equal to the difference in energy levels.", "These excited atoms soon return to their original state, spontaneously emitting a photon of the same wavelength in a random direction. Thus, very little light of absorbed wavelengths reaches a spectrometer on Earth.", "Since there are discrete energy levels, atoms absorb photons of specific discrete wavelengths, resulting in dark lines (Fraunhofer lines) corresponding to these wavelengths, and continuous spectra everywhere else."], "sec": "SA"}, {"id": "OE11", "m": 3, "q": "Explain how absorption spectra can be used to identify the presence of an element.", "b": ["The wavelengths of emission lines correspond to photons with energy equal to the difference between two energy levels of an atom. As elements have unique electron configurations, these differences vary for each element, resulting in unique line emission spectra.", "Absorption lines occur at the same wavelengths, but only a subset of emission lines are present, as some absorption transitions starting from excited states occur infrequently and thus do not cause a dark line. Absorption spectra are also unique.", "The line absorption spectrum of a mixture has all absorption lines of every individual element in the mixture. Hence, if some of the emission lines correspond to absorption lines in the mixture, then the element is likely in the mixture."], "sec": "SA"}, {"id": "OE12", "m": 3, "q": "Explain why some coloured lines in the emission spectrum are not present as dark lines in the absorption spectrum.", "b": ["An absorption spectrum is produced from a continuous spectrum of light passing through a cool gas. The cool gas atoms are primarily in the ground state.", "Hence, there may be very few absorptions that cause an atom to transition from an already excited state to a higher energy excited state, resulting in no dark lines corresponding to these photons.", "Lines at these wavelengths are still present in the emission spectrum from atoms spontaneously emitting photons when transitioning from higher to lower energy levels."], "sec": "SA"}, {"id": "OE13", "m": 2, "q": "Explain the production of multiple photons via fluorescence.", "b": ["Fluorescence occurs when a high-energy photon (e.g UV) is absorbed by an atom, causing it to transition to an energy state above the lowest energy excited state through an electron transition.", "When the atom transitions back to ground state, it does so in multiple electron transitions, emitting multiple lower energy photons with combined energy equal to the energy of the original photon. At least one of these is a visible light photon, causing the object to glow."], "sec": "SA"}, {"id": "OE14", "m": 3, "q": "Compare the process of stimulated emission with that of spontaneous emission.", "b": ["Stimulated emission occurs when a photon with energy equal to the difference of two energy levels in an atom is incident on the atom while it is in an excited, and typically metastable, state.", "This stimulates an electron to transition from a higher energy level to a lower energy level, emitting a photon with the same frequency, phase, and direction as the original photon without absorbing the original photon.", "Conversely, spontaneous emission occurs when an electron in an excited atom randomly transitions from a higher energy state to a lower energy state, emitting a photon with a random direction and phase, with energy equal to the difference in energy levels."], "sec": "SA"}, {"id": "OE15", "m": 3, "q": "Explain how stimulated emission can produce coherent light in a laser.", "b": ["Stimulated emission in lasers occurs when a photon with energy equal to the difference of two energy levels in an atom is incident on the atom while it is in a metastable state.", "This stimulates an electron to transition from a higher energy level to a lower energy level, emitting a photon with the same frequency, phase, and direction as the original photon without absorbing the original photon.", "The two photons maintain a constant phase relationship, and through further stimulated emission, this coherent light can be amplified."], "sec": "SA"}, {"id": "OE16", "m": 4, "q": "Explain the conditions required for stimulated emission to predominate over absorption when light is incident on a set of atoms.", "b": ["Stimulated emission is likely to predominate when atoms have a metastable state and there is a population inversion of atoms.", "A metastable state of an atom is an excited state it remains in for an extended period. This increases the probability of a population inversion occurring, which is when more of the atoms in the gain medium are in the higher laser energy state than the lower laser energy state.", "When a photon with energy equal to the difference of the two laser energy states is incident on an atom in the higher state, it causes the stimulated emission of a photon with the same frequency, phase and direction without absorbing the original photon.", "However, such a photon incident on an atom in the lower state is absorbed. Hence, a population inversion makes photons more likely to cause stimulated emission than to be absorbed, which results in amplification of light."], "sec": "SA"}, {"id": "OE17", "m": 2, "q": "Explain how a population inversion is maintained in a He-Ne laser.", "b": ["A high voltage power supply generates a strong electric field which produces a gas discharge. These electrons are accelerated by the electric field and transfer their kinetic energy to helium atoms, exciting them to their metastable state.", "Helium atoms constantly transfer energy to neon atoms, exciting them to the higher laser energy state, which sustains the population inversion."], "sec": "SA"}, {"id": "OE18", "m": 4, "q": "Describe the purpose of the pump and the gain medium in a gas laser.", "b": ["The pump is a gas discharge which occurs due to the strong electric field produced by the high voltage power supply.", "This continuous energy supply causes atoms in the gain medium to be excited to the metastable higher laser energy state.", "The gain medium is a gas with a metastable state where atoms can transition to a lower energy level through stimulated emission.", "Repeated stimulated emission involving atoms in the gain medium causes the amplification of light which enables the production of a laser beam."], "sec": "SA"}, {"id": "OE19", "m": 4, "q": "Explain the purpose of each of the mirrors in a laser.", "b": ["The totally reflecting mirror reflects photons with negligible loss of energy, so photons remain at the same frequency.", "Thus, they can produce more photons of the same frequency through stimulated emission of photons with the same frequency, phase, and direction, resulting in light amplification.", "The partially reflecting mirror allows some photons to pass through, producing a high intensity coherent and monochromatic laser beam.", "However, some photons are reflected with negligible loss of energy, ensuring that there are always sufficient photons inside the tube for continuous amplification."], "sec": "SA"}, {"id": "OE20", "m": 4, "q": "Explain how LADS can be used to determine the depth of seawater.", "b": ["Laser light emitted from an airplane in the sky reflects off the water surface and sea floor.", "The time of travel in each case is recorded, which is used to find the time difference ∆𝑡 between the pulse arrivals.", "This time difference is the time taken to travel from the water surface to the sea floor and back. This distance is twice the depth.", "Hence, if the speed of light in seawater 𝑣 is known, then the depth of the 𝑣∆𝑡 seawater can be calculated using 𝑑 = 2 ."], "sec": "SA"}, {"id": "OE21", "m": 2, "q": "Explain how ionising radiation may damage living matter.", "b": ["Ionising radiation can ionise atoms by removing electrons from them, which can damage and destroy chemical bonds.", "This can cause harmful genetic mutations and can also kill the cells."], "sec": "SA"}, {"id": "OS1", "m": 2, "q": "Describe the useful properties of laser light.", "b": ["High intensity (for metal welding)", "Narrow beam (for barcode scanners)", "Coherent (for double-slit experiment)", "Monochromatic (for eye surgery)", "Unidirectional (for rangefinding)"], "sec": "ST"}, {"id": "OS2", "m": 2, "q": "State the requirements for the safe handling of lasers.", "b": ["Point the laser away from people, reflective surfaces, and flammable or combustible materials.", "Wear protective eyewear specific to the laser in use and cover skin to avoid burns."], "sec": "ST"}, {"id": "OS3", "m": 1, "q": "State two factors that limit the maximum depth of water determined by LADS.", "b": ["Water turbidity (sediments), Seabed reflectivity, Depth of the ocean, Altitude of the plane, Peak pulse power of the laser."], "sec": "ST"}, {"id": "PE1", "m": 2, "q": "Describe electromagnetic forces in terms of exchange particles (gauge bosons).", "b": ["The electromagnetic forces of attraction and repulsion are mediated by the exchange of photons between charged particles, with infinite range.", "The exchange of photons creates either an impulse towards (attraction) or away (repulsion) from the charged particles."], "sec": "SM"}, {"id": "PE2", "m": 2, "q": "Describe the strong nuclear force in terms of exchange particles (gauge bosons).", "b": ["The strong nuclear force is mediated by the short-range exchange of gluons between quarks.", "The exchange of gluons creates an impulse towards other quarks at short distances, holding quarks together inside hadrons."], "sec": "SM"}, {"id": "PE3", "m": 2, "q": "Describe the weak nuclear force in terms of exchange particles (gauge bosons).", "b": ["The weak nuclear force is mediated by the short-range exchange of W and Z bosons during quark and lepton decay.", "During a decay, a W or Z boson is produced along with the daughter particle, ensuring that charge is conserved."], "sec": "SM"}, {"id": "PE4", "m": 2, "q": "Describe the gravitational force in terms of exchange particles (gauge bosons).", "b": ["The gravitational force is theoretically mediated by the exchange of gravitons between masses, with infinite range.", "The exchange of gravitons creates an impulse towards other masses."], "sec": "SM"}, {"id": "PE5", "m": 4, "q": "Explain why high kinetic energies and temperatures are needed for nuclear fusion to occur.", "b": ["For nuclei to fuse, they must get extremely close to each other as the strong nuclear force, which fuses nuclei together, only acts over tiny distances.", "There is a repulsive force between the positively charged nuclei, which becomes stronger as they get closer.", "Thus, negative work is done on the nuclei as they move towards each other, which significantly reduces their kinetic energy as per the Law of Conservation of Energy 𝑊 = ∆𝐸𝑘 .", "As 𝐸𝑘 ∝ 𝑇, this means that high kinetic energies and high temperatures are required for nuclear fusion to occur."], "sec": "SM"}, {"id": "PS1", "m": 2, "q": "Identify the fundamental particles affected by each type of fundamental force.", "b": ["Electromagnetic: All charged particles.", "Strong nuclear: Quarks.", "Weak nuclear: Quarks and Leptons.", "Gravitational: All particles with mass and energy."], "sec": "ST"}, {"id": "PS2", "m": 3, "q": "Describe the different types of hadrons that can be produced from different combinations of quarks and antiquarks.", "b": ["Baryons are composed of three quarks such that the total charge is an integer, with baryon number equal to 1.", "Antibaryons are composed of three antiquarks such that the total charge is an integer, with baryon number equal to -1.", "Mesons are composed of a quark and an antiquark such that the total charge is an integer, with baryon number equal to 0."], "sec": "ST"}, {"id": "PS3", "m": 1, "q": "A neutral pion is composed of one up quark and one antiup quark. State why it has a short lifetime.", "b": ["The neutral pion is composed of a matter-antimatter pair which undergo annihilation. 𝒆∆𝑽"], "sec": "ST"}];

function loadRuns(){try{const r=JSON.parse(localStorage.getItem(RK)||'[]');return Array.isArray(r)?r:[]}catch(e){return[]}}
function saveRuns(a){while(true){try{localStorage.setItem(RK,JSON.stringify(a));return}catch(e){if(a.length<=1)return;a.pop()}}}
function hydrate(run){R=run.rows.map(r=>({title:r.n}));[times,scs,tots,skp,revs].forEach(a=>a.length=0);run.rows.forEach((r,i)=>{times[i]=r.t;scs[i]=r.s;tots[i]=r.T;skp[i]=r.sk;revs[i]=run.revs[i]||[]});lbl=run.lbl;acc=run.acc}
function end(){playing=false;clearInterval(tm);stopMusic();$('.clk').hidden=true;
const rows=R.map((r,i)=>({n:r.title,t:times[i],s:scs[i],T:tots[i],sk:!!skp[i],b:skp[i]?SKIP:bon(scs[i],tots[i])}));
const bt=rows.reduce((a,r)=>a+r.b,0),run={at:new Date().toISOString(),lbl,daily:curDaily,acc,bt,fin:Math.max(0,acc+bt*1000),rows,revs:revs.map(r=>(r||[]).map(it=>({q:it.q,you:it.you,ans:it.ans,pts:it.pts,got:it.got,of:it.of})))};
const a=loadRuns();a.unshift(run);saveRuns(a);const pd=curDaily?postDaily(run):Promise.resolve();showEnd(run,true);if(run.daily)pd.then(()=>renderBoard($('#board'),run.daily.date))}
function showEnd(run,fresh){onStart=false;if(!fresh)hydrate(run);const rows=run.rows,fin=run.fin,bt=run.bt,nf=rows.filter(r=>r.s==r.T&&!r.sk).length,
bs=b=>(b>0?'+':b<0?'−':'')+Math.abs(b)+'s',bc=b=>b<0?'ok':b>0?'no':'',
share=`Physics Gauntlet ${run.lbl}\n${rows.map(r=>r.sk?'⚫':em(r.s,r.T)).join('')}\n${fmtT(fin)}`,when=new Date(run.at).toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'});
$('.clk').hidden=true;
stage.innerHTML=`<p class="meta c">Run summary${fresh?'':' · '+when}</p><p class="big">${fmtT(fin)}</p><p class="mute c">${nf} of ${rows.length} rounds clean</p>${run.daily?'<h2>Daily #'+run.daily.n+' leaderboard</h2><div id="board"></div>':''}
<div class="rtw"><table class="rt"><tr><th>Round</th><th>Score</th><th>Time</th><th>Adjustment</th><th>Clean?</th></tr>${rows.map(r=>`<tr class="${r.sk?'skp':r.s==r.T?'g':r.s>=r.T/2?'y':'r'}"><td>${esc(r.n)}</td><td>${r.sk?'–':r.s+'/'+r.T}</td><td>${fmtT(r.t)}</td><td class="${r.sk?'no':bc(r.b)}">${r.sk?'skip '+bs(r.b):bs(r.b)}</td><td>${r.sk?'':r.s==r.T?'<span class="fl">⚡ Clean run</span>':'<span class="nd">Marks dropped</span>'}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td></td><td>${fmtT(run.acc)}</td><td class="${bc(bt)}">${bs(bt)}</td><td></td></tr></table></div>
<h2>Review each game</h2><button class="btn" id="pdf">Download PDF (questions, my answers, suggested answers)</button><p class="mute" id="pm"></p><div id="revwrap"><h2 class="ptitle">Physics Gauntlet review</h2>${reviewHtml(rows)}</div><pre>${share}</pre><button class="btn" id="cp">Copy result</button> <button class="btn alt" id="again">New random gauntlet</button> <button class="btn alt" id="back">Previous runs</button><p class="mute">Time adjustment per round = 60s × (marks lost − 1): perfect −60s, one mark lost 0s, then +60s for each further mark lost, capped at +300s. Skip: +360s.</p>`;
$('#cp').onclick=()=>{try{navigator.clipboard.writeText(share)}catch(e){}$('#cp').textContent='Copied (or select the text above)'};$('#again').onclick=()=>begin(false);$('#back').onclick=showStart;$('#pdf').onclick=()=>savePDF(rows,fin);if(run.daily&&!fresh)renderBoard($('#board'),run.daily.date)}
function begin(dd){onStart=false;curDaily=dd||null;sd=dd?seedFor(dd.date):(Math.random()*4294967296)>>>0;lbl=dd?'Daily #'+dd.n+' '+dd.date:'random '+sd.toString(36);
R=buildR(!!dd);saveHist(lastPicked);acc=0;rs=null;times.length=0;revs.length=0;scs.length=0;tots.length=0;skp.length=0;clearInterval(tm);stopMusic();playing=true;
$('.clk').hidden=false;$('#clock').textContent='0:00.00';startMusic();$('#mu').hidden=false;

else{h+=` <span class="mute">· Signed in as <b>${esc(acct.name||acct.email||'you')}</b></span> <button class="btn alt" id="so" style="padding:.2em .7em;margin:0 0 0 6px">Sign out</button></p>`;

stage.insertAdjacentHTML('afterbegin',h+'</div>');

async function myDay(date){const {data}=await sb.from('daily_results').select('finished_at,final_ms').eq('day',date).maybeSingle();return{rec:data?{done:!!data.finished_at,fin:data.final_ms}:null}}
async function refreshDaily(d){if(!sb||!acct)return;try{const m=await myDay(d.date);if(!onStart)return;if(m.rec){const dg=$('#dg');if(dg)dg.disabled=true;$('#dmsg').textContent=m.rec.done?'You have played today’s daily: final time '+fmtT(m.rec.fin)+'.':'You started today’s daily but did not finish, so the attempt is used.'}}catch(e){}}
async function startDaily(){const msg=$('#dmsg');if(!sb||!acct)return;msg.textContent='Checking your daily attempt...';

if(data.status!='started'){msg.textContent=data.finished?'You have already played today’s daily: final time '+fmtT(data.final_ms)+'.':'You started today’s daily but did not finish, so the attempt is used.';return}
begin({date:data.day,n:dayNo(data.day)})}
async function postDaily(run){if(!sb||!acct)return;const rs_=run.rows,mk=rs_.reduce((a,r)=>a+(r.sk?0:r.s),0),tot=rs_.reduce((a,r)=>a+r.T,0),nf=rs_.filter(r=>r.s==r.T&&!r.sk).length;
const {error}=await sb.rpc('finish_daily',{p_time_ms:Math.round(run.acc),p_bonus_s:Math.round(run.bt),p_clean:nf,p_marks:mk,p_total:tot,p_rounds:rs_.map(r=>({n:r.n,s:r.s,T:r.T,t:Math.round(r.t),b:r.b,sk:r.sk}))});
if(error){const el=$('#board');if(el)el.insertAdjacentHTML('beforebegin','<p class="no">Could not save your daily score: '+esc(error.message)+'</p>')}}
