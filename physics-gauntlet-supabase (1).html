<style>
:root{--bg:#0a0f1d;--panel:#101a30;--ink:#e8f1ff;--mute:#8a9bbd;--acc:#f2b84b;--accT:#f2b84b;--sig:#35e0c2;--ok:#5ee28a;--no:#ff5d73;--line:#24365c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(rgba(53,224,194,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(53,224,194,.05) 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font:16px/1.5 'Space Grotesk','Segoe UI',system-ui,sans-serif}

.sub,.meta,.mute{color:var(--mute);margin:.2em 0}
.c{text-align:center}
#stage{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px}
.q{font-size:1.05rem;margin:.4em 0 .8em}
.row{display:flex;gap:8px;flex-wrap:wrap}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.55em .7em;width:100%;min-height:96px}

.btn:disabled{opacity:.5;cursor:default}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.6em;cursor:pointer}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,transparent)}
.opt.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 22%,transparent);text-decoration:line-through}.pts{font-weight:800;color:var(--accT);margin:.8em 0 0}

.rv{border:1px solid var(--line);border-radius:4px;margin:8px 0;padding:8px 12px}.rv summary{cursor:pointer;font-weight:600}.ri{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}.ri img{max-width:100%;border-radius:4px;margin:6px 0}.ri ul{margin:.3em 0;padding-left:1.2em}.ri p{margin:.3em 0}

<h1><svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke-width="2" stroke-dasharray="3 3" style="stroke:var(--sig)"/><circle cx="5" cy="20" r="3.5" style="fill:var(--acc)"/><circle cx="35" cy="20" r="3.5" style="fill:var(--no)"/><path d="M20 12v16M12 20h16" stroke-width="2" stroke-linecap="round" style="stroke:var(--ink)"/></svg>Physics Gauntlet</h1>
<p class="sub">SACE Stage 2 Physics · eleven rounds · one clock · strict marking</p>

<p class="mute c" style="font-size:.8rem;margin:.3em 0"><label style="cursor:pointer;text-decoration:underline">Use your own music file<input type="file" id="mf" accept="audio/*" hidden></label><span id="cr"></span></p>
<section id="stage"></section>
</main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dstr=new Date().toISOString().slice(0,10);
const dseed=[...dstr].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);let sd=dseed;let lbl='';
function rnd(){sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const sh=a=>a.map(v=>[rnd(),v]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const pick=a=>a[Math.floor(rnd()*a.length)];
const em=(s,T)=>s==T?'🟢':s>=T/2?'🟡':'🔴';
let acc=0,rs=null,tm;const times=[],scs=[],tots=[],skp=[],revs=[];let dl=null;try{claude.use('downloads').then(d=>{dl=d},()=>{})}catch(e){}
const BT=[300,240,180,120,60,0,-60];const SKIP=360;const bon=(s,T)=>Math.min(300,60*(T-s-1));const bsx=b=>(b>0?'+':b<0?'−':'')+Math.abs(b)+'s';
const fmtT=ms=>{const s=ms/1000;return Math.floor(s/60)+':'+(s%60).toFixed(2).padStart(5,'0')};

/* one-attempt click runner: wrong = 0 for that part */
function quiz(el,qs,done){let i=0,s=0;const rv=[];
function dq(o){el.innerHTML=`<p class="q">Part ${i+1} of ${qs.length}. ${o.q}<br><span class="mute">Drag from the gold dot P in the direction of the field. One attempt, marked instantly.</span></p><canvas id="qc" width="640" height="360" aria-label="Drawing area"></canvas><div id="fb"></div>`;
const c=$('#qc',el),x=c.getContext('2d'),ink=cv('--ink'),P=o.d.P;x.lineWidth=2.5;x.strokeStyle=x.fillStyle=ink;o.d.scene(x);
x.fillStyle=cv('--acc');x.beginPath();x.arc(P[0],P[1],7,0,7);x.fill();x.fillStyle=ink;x.font='bold 15px sans-serif';x.textAlign='left';x.fillText('P',P[0]+11,P[1]-9);
const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*360/r.height]};let st=null,dn=false;
c.onpointerdown=e=>{if(dn)return;st=pos(e);c.setPointerCapture(e.pointerId)};
c.onpointerup=e=>{if(!st||dn)return;const a=st,b=pos(e),v=[b[0]-a[0],b[1]-a[1]],L=Math.hypot(v[0],v[1]);st=null;if(L<30)return;dn=true;
const E=o.d.exp,ok=Math.acos(Math.max(-1,Math.min(1,(v[0]*E[0]+v[1]*E[1])/L)))<=28*Math.PI/180;
x.lineWidth=3;x.strokeStyle=ok?cv('--ok'):cv('--no');ln(x,a[0],a[1],b[0],b[1]);arrow(x,b[0],b[1],Math.atan2(v[1],v[0]),x.strokeStyle);
if(!ok){const t=[P[0]+80*E[0],P[1]+80*E[1]];x.strokeStyle=cv('--acc');ln(x,P[0],P[1],t[0],t[1]);arrow(x,t[0],t[1],Math.atan2(E[1],E[0]),cv('--acc'))}
if(ok)s++;rv.push({q:tx(o.q),you:'Arrow dragged '+Math.round(Math.acos(Math.max(-1,Math.min(1,(v[0]*E[0]+v[1]*E[1])/L)))*180/Math.PI)+' degrees from the correct direction',ans:o.ans||'The gold arrow shows the correct direction.',got:ok?1:0,of:1,img:snap(o,{a,b,ok})});
$('#fb',el).innerHTML=`<p class="fb"><b>${ok?'Correct, 1 mark.':'Wrong, 0 marks.'}</b> ${ok?'':'The gold arrow is the correct direction. '}Within 28° counts as correct.</p>${i<qs.length-1?'<button class="btn alt" id="qn">Next part</button>':''}`;
if(i==qs.length-1)done(s,qs.length,rv);else{$('#qn',el).onclick=()=>{i++;q()};$('#qn',el).focus()}}}

function q(){const o=qs[i];if(o.d)return dq(o);
el.innerHTML=`${o.pre||''}${o.fn?'<canvas id="qc" width="640" height="360" aria-label="Field diagram"></canvas>':''}<p class="q">Part ${i+1} of ${qs.length}. ${o.q}</p><div class="opts">${o.o.map((t,k)=>`<button class="opt" data-k="${k}">${t}</button>`).join('')}</div><div id="fb"></div>`;
if(o.fn){const x=$('#qc',el).getContext('2d');x.lineWidth=2.5;x.strokeStyle=x.fillStyle=cv('--ink');o.fn(x,cv('--ink'))}
el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
el.querySelectorAll('.opt').forEach(x=>x.disabled=true);$(`[data-k="${o.a}"]`,el).classList.add('good');
if(k==o.a)s++;else b.classList.add('bad');rv.push({q:tx(o.q),you:o.o[k],ans:o.o[o.a]+'. '+o.w,got:k==o.a?1:0,of:1,img:o.fn?snap(o):null});
$('#fb',el).innerHTML=`<p class="fb"><b>${k==o.a?'Correct, 1 mark.':'Wrong, 0 marks.'}</b> ${o.w}</p>${i<qs.length-1?'<button class="btn alt" id="qn">Next part</button>':''}`;
if(i==qs.length-1)done(s,qs.length,rv);else{$('#qn',el).onclick=()=>{i++;q()};$('#qn',el).focus()}})}
q()}

/* diagrams */
function arrow(x,px,py,a,col){x.save();x.translate(px,py);x.rotate(a);x.fillStyle=col;x.beginPath();x.moveTo(9,0);x.lineTo(-6,-6);x.lineTo(-6,6);x.fill();x.restore()}
function ln(x,a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}
const cx=320,cy=180;
const radial=(x,c,dir)=>{for(let k=0;k<12;k++){const a=k*Math.PI/6;ln(x,cx+18*Math.cos(a),cy+18*Math.sin(a),cx+160*Math.cos(a),cy+160*Math.sin(a));arrow(x,cx+100*Math.cos(a),cy+100*Math.sin(a),a+dir,c)}};
const magnet=(x,c,f)=>{x.strokeRect(250,163,140,34);for(const h of[40,80,120])for(const sg of[-1,1]){const w=30+h*.4;x.beginPath();x.moveTo(250,180);x.bezierCurveTo(250-w,180+sg*h*1.33,390+w,180+sg*h*1.33,390,180);x.stroke();arrow(x,320,180+sg*h,f?Math.PI:0,c)}};
const wire=(x,c,f)=>{x.beginPath();x.arc(cx,cy,10,0,7);x.fill();for(const r of[45,85,125]){x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();arrow(x,cx,cy-r,f?0:Math.PI,c);arrow(x,cx,cy+r,f?Math.PI:0,c)}};
const plates=(x,c,f)=>{x.lineWidth=6;ln(x,140,80,500,80);ln(x,140,280,500,280);x.lineWidth=2.5;for(let p=170;p<=470;p+=60){ln(x,p,86,p,274);arrow(x,p,180,f?-Math.PI/2:Math.PI/2,c)}};
function tag(x,t,px,py,col){x.fillStyle=col;x.font='bold 18px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,px,py)}
const un=v=>{const L=Math.hypot(v[0],v[1]);return[v[0]/L,v[1]/L]};
const dmk=[
()=>{const pos=rnd()<.5,a=rnd()*6.283,P=[cx+120*Math.cos(a),cy+120*Math.sin(a)];return{q:`An isolated <b>${pos?'positive':'negative'}</b> point charge is at the centre. Show the direction of the electric field at P.`,ans:pos?'Directly away from the charge, along the line from the charge through P.':'Directly towards the charge, along the line from P to the charge.',d:{P,exp:un([(pos?1:-1)*Math.cos(a),(pos?1:-1)*Math.sin(a)]),scene:x=>{x.fillStyle=pos?'#d9534f':'#4a7fd1';x.beginPath();x.arc(cx,cy,14,0,7);x.fill();tag(x,pos?'+':'−',cx,cy,'#fff')}}}},
()=>{const f=rnd()<.5,P=pick([[320,90],[320,270],[200,180],[440,180],[235,100],[405,260]]),m=f?[1,0]:[-1,0],r=un([P[0]-320,-(P[1]-180)]),md=m[0]*r[0]+m[1]*r[1],B=[3*md*r[0]-m[0],3*md*r[1]-m[1]];
return{q:'Show the direction of the magnetic field of this bar magnet at P.',ans:'Along the tangent to the field line through P, pointing from the north pole round to the south pole.',d:{P,exp:un([B[0],-B[1]]),scene:x=>{x.fillStyle=f?'#4a7fd1':'#d9534f';x.fillRect(250,163,70,34);x.fillStyle=f?'#d9534f':'#4a7fd1';x.fillRect(320,163,70,34);tag(x,f?'S':'N',285,180,'#fff');tag(x,f?'N':'S',355,180,'#fff')}}}},
()=>{const out=rnd()<.5,a=rnd()*6.283,rr=90+rnd()*40,P=[cx+rr*Math.cos(a),cy+rr*Math.sin(a)],t=un([P[1]-cy,-(P[0]-cx)]);return{q:`A long straight wire carries current <b>${out?'out of':'into'} the page</b> (seen end-on). Show the direction of the magnetic field at P.`,ans:out?'Anticlockwise around the wire, along the tangent to the circle through P (right-hand grip rule, thumb out of the page).':'Clockwise around the wire, along the tangent to the circle through P (right-hand grip rule, thumb into the page).',d:{P,exp:out?t:[-t[0],-t[1]],scene:x=>{x.beginPath();x.arc(cx,cy,12,0,7);x.stroke();if(out){x.beginPath();x.arc(cx,cy,3,0,7);x.fill()}else{ln(x,cx-7,cy-7,cx+7,cy+7);ln(x,cx+7,cy-7,cx-7,cy+7)}}}}},
()=>{const tp=rnd()<.5,P=[200+rnd()*240,150+rnd()*60];return{q:'Show the direction of the electric field at P between the plates.',ans:tp?'Straight down, from the positive (top) plate to the negative plate.':'Straight up, from the positive (bottom) plate to the negative plate.',d:{P,exp:tp?[0,1]:[0,-1],scene:x=>{x.lineWidth=6;ln(x,140,80,500,80);ln(x,140,280,500,280);x.lineWidth=2.5;tag(x,tp?'+':'−',110,80,'#d9534f');tag(x,tp?'−':'+',110,280,'#4a7fd1')}}}}];
function gen(){const fmk=[
f=>({fn:(x,c)=>radial(x,c,f?Math.PI:0),q:'This is the electric field around an isolated point charge. What is the sign of the charge?',o:['Positive','Negative','Cannot be determined'],a:f?1:0,w:`Field lines point ${f?'towards':'away from'} the charge, so it is ${f?'negative':'positive'}.`}),
f=>({fn:(x,c)=>magnet(x,c,f),q:'Arrows show the magnetic field direction around a bar magnet. Which end is the north pole?',o:['Left end','Right end','Cannot be determined'],a:f?1:0,w:`Field lines leave the N pole, so N is the ${f?'right':'left'} end.`}),
f=>({fn:(x,c)=>wire(x,c,f),q:'This is the magnetic field around a long straight wire, seen end-on. The current is…',o:['out of the page','into the page','cannot be determined'],a:f?1:0,w:`Right-hand grip rule: ${f?'clockwise':'anticlockwise'} field lines mean current ${f?'into':'out of'} the page.`}),
f=>({fn:(x,c)=>plates(x,c,f),q:'This is the electric field between two parallel plates. Which plate is positive?',o:['Top','Bottom','Cannot be determined'],a:f?1:0,w:`Field lines run from + to −, so the ${f?'bottom':'top'} plate is positive.`})];
const fqQs=sh(dmk).slice(0,2).map(m=>m()).concat([sh(fmk)[0](rnd()<.5)]);
const IC=[['N pole','towards',0,'The coil opposes the approaching N pole, so its near face becomes N: anticlockwise.'],['N pole','away from',1,'The coil attracts the leaving N pole with a near-face S: clockwise.'],['S pole','towards',1,'The coil repels the approaching S pole with a near-face S: clockwise.'],['S pole','away from',0,'The coil attracts the leaving S pole with a near-face N: anticlockwise.'],['','',2,'Flux is not changing, so there is no emf and no current.']];
const icQs=sh(IC).slice(0,3).map(c=>({q:c[0]?`The <b>${c[0]}</b> of a bar magnet moves <b>${c[1]}</b> a coil. Viewed from the magnet’s side, the induced current is…`:'A bar magnet is held <b>stationary</b> inside a coil. The induced current is…',o:['Clockwise','Anticlockwise','No induced current'],a:[1,0,2][c[2]],w:c[3]}));

/* EM spectrum, one attempt */
const REG=['Radio','Microwave','Infrared','Visible','Ultraviolet','X-ray','Gamma'];
const sup=n=>String(n).replace(/[-\d]/g,d=>'⁻⁰¹²³⁴⁵⁶⁷⁸⁹'[d=='-'?0:+d+1]);
const sc=(x,u)=>{const e=Math.floor(Math.log10(Math.abs(x))+1e-9),m=(x/10**e).toFixed(1);return e==0?m+' '+u:m+'×10'+sup(e)+' '+u};
const PRE='';
const FP=[[1.5e8,0],[3e10,1],[6e11,2],[2.4e13,2],[4.0e14,2],[5.5e14,3],[7.8e14,4],[2.4e15,4],[4.8e16,5],[2e17,5],[1.2e19,5],[2.4e20,6]];
const spO=Math.floor(rnd()*3);
const info=f=>`f = ${sc(f,'Hz')}, λ = ${sc(3e8/f,'m')}, E = ${sc(6.63e-34*f/1.6e-19,'eV')}`;
const spQs=sh(FP).slice(0,4).map((s,i)=>{const f=s[0],g=[`frequency <b>${sc(f,'Hz')}</b>`,`wavelength <b>${sc(3e8/f,'m')}</b>`,`photon energy <b>${sc(6.63e-34*f/1.6e-19,'eV')}</b>`][(i+spO)%3];
return{pre:PRE,q:`Which region has ${g}?`,o:REG,a:s[1],w:`${REG[s[1]]}: ${info(f)}.`}});
const q5=pick([[1e8,0],[1e10,1],[3e13,2],[1.2e19,5],[2.4e20,6]]),e5=sc(6.63e-34*q5[0]/1.6e-19,'eV');
spQs.push({pre:PRE,q:`Photons have energy <b>${e5}</b>. (a) Which region?`,o:REG,a:q5[1],w:`${REG[q5[1]]}: ${info(q5[0])}.`},
{pre:PRE,q:`Same photons, energy ${e5}. (b) Is this radiation ionising?`,o:['Ionising','Non-ionising'],a:q5[1]>=5?0:1,w:q5[1]>=5?'X-rays and gamma rays carry enough energy per photon to ionise atoms.':'Photon energy is far too low to ionise atoms.'});

return{fqQs,icQs,spQs}}

const BANK=[{"id": "AE1", "m": 2, "q": "State and explain how the horizontal velocity of a projectile changes as it moves towards the surface.", "b": ["The horizontal component of velocity does not change with time;", "In the absence of air resistance, the only force on the projectile is the constant gravitational force acting vertically, so the net horizontal force on the projectile is zero which results in zero horizontal acceleration."], "sec": "PM"}, {"id": "AE2", "m": 2, "q": "State and explain how the vertical velocity of a projectile changes as it moves towards the surface.", "b": ["The vertical component of velocity increases with time;", "The vertical components of velocity are increased by the force of gravity which causes a uniform downwards acceleration."], "sec": "PM"}, {"id": "AE3", "m": 2, "q": "State and explain how the vertical acceleration of a projectile changes as it moves towards the surface.", "b": ["The vertical acceleration does not change with time;", "The vertical acceleration is due to gravity which is constant near Earth’s surface due to the constant force of gravity."], "sec": "PM"}, {"id": "AE4", "m": 3, "q": "Identify the launch angle that produces the maximum horizontal range and provide a qualitative explanation for your answer.", "b": ["45°", "Reducing the launch angle reduces the vertical component of the initial velocity which decreases the time of flight.", "Increasing the launching angle decreases the horizontal component of velocity.", "45° provides an optimal balance between time of flight and horizontal velocity, the two factors affecting range."], "sec": "PM"}, {"id": "AE5", "m": 2, "q": "Describe and explain the effect of initial velocity on the maximum range of a projectile.", "b": ["Increasing the initial velocity increases the initial vertical velocity which increases the time of flight.", "Increasing the initial velocity also increases the horizontal component of velocity, so the range increases."], "sec": "PM"}, {"id": "AE6", "m": 2, "q": "Describe and explain the effect of initial velocity on the time of flight of a projectile.", "b": ["The time of flight increases with the initial velocity of a projectile;", "Increasing the initial velocity will increase the vertical component of velocity which results in the projectile taking longer to reach and fall from the maximum height."], "sec": "PM"}, {"id": "AE7", "m": 2, "q": "Describe and explain the effect of initial velocity on the max height of a projectile.", "b": ["The maximum height increases with the initial velocity of a projectile;", "Increasing the initial velocity will increase the vertical component of velocity which results in the projectile taking longer to reach max height, meaning it reaches a higher height."], "sec": "PM"}, {"id": "AE8", "m": 2, "q": "Describe and explain the effect that launching from above the ground has on the time of flight of a projectile in comparison with launching from the ground.", "b": ["Launching from a position above ground level increases the maximum height of the projectile.", "Thus it takes longer to fall to the ground while taking the same time to reach maximum height, meaning overall time of flight is increased."], "sec": "PM"}, {"id": "AE9", "m": 3, "q": "Describe and explain the effect that launching from above the ground has on the range of a projectile in comparison with launching from the ground.", "b": ["Launching from a position above ground level increases the maximum height of the projectile which means it takes longer to fall to the ground. Thus its time of flight is increased.", "Time of flight is directly proportional to the range of the projectile;", "Increasing the time of flight results in a proportional increase in the range as the horizontal velocity is unchanged."], "sec": "PM"}, {"id": "AE10", "m": 2, "q": "Describe and explain the effect of launch angle on the time of flight of a projectile.", "b": ["Time of flight increases with launch angle.", "Launch angle increases initial vertical velocity which increases time of flight as it takes longer to reach and fall from max height."], "sec": "PM"}, {"id": "AE11", "m": 2, "q": "Describe and explain the effect of launch angle on the max height of a projectile.", "b": ["Maximum height increases with launch angle.", "Launch angle increases initial vertical velocity which increases time taken to reach maximum height which increases maximum height."], "sec": "PM"}, {"id": "BE1", "m": 3, "q": "Describe and explain the effects of air resistance on the vertical and horizontal components of the velocity, maximum height, and range of a projectile.", "b": ["Air resistance decreases the vertical and horizontal component of velocity of a projectile throughout flight;", "Air resistance decreases the maximum height of a projectile since there is increased downward acceleration due to air resistance during ascent.", "Air resistance decreases the range of a projectile by decreasing the horizontal component of velocity."], "sec": "PM"}, {"id": "BE2", "m": 2, "q": "Describe and explain the effects of air resistance on the time for a projectile to reach the maximum height or to fall from the maximum height.", "b": ["Air resistance decreases the time to reach maximum height by increasing the downward acceleration during ascent.", "Air resistance increases the time taken to fall from the maximum height by opposing the vertical component of velocity."], "sec": "PM"}, {"id": "BE3", "m": 3, "q": "Explain the effects of speed, cross-sectional area of the body, and density of the medium on the drag force on a moving body.", "b": ["Drag force is proportional to the square of the speed. As speed increases, the moving body will collide with more particles per unit time. This increases the drag force.", "As cross-sectional area increases, the number of particles that the moving body will collide with increases, therefore increasing the drag force.", "The denser the medium, the more particles that the moving body will collide with. Therefore, increasing the drag force."], "sec": "PM"}, {"id": "BE4", "m": 3, "q": "Air density decreases with altitude. Predict and explain whether the terminal velocity of a peregrine falcon is lower, the same, or greater at high altitudes.", "b": ["Terminal velocity is greater at higher altitudes.", "The drag force is smaller when the falcon descends through lower density air.", "Hence, the falcon can accelerate to a greater vertical speed before the vertical forces of weight and drag and balanced."], "sec": "PM"}, {"id": "BE5", "m": 2, "q": "When swooping for prey, a peregrine falcon brings its wings close to its body. Explain how this action helps the peregrine falcon catch its prey.", "b": ["Bringing its wings closer to the body reduces the cross-sectional area of the falcon.", "This results in a proportional decrease in the drag force/air resistance, which allows the falcon to descend at a greater speed and catch its prey before it becomes aware of the descending falcon."], "sec": "PM"}, {"id": "BE6", "m": 3, "q": "Explain how a skydiver reaches terminal velocity.", "b": ["As a person accelerates downwards due to Gravity, its velocity increases, which increases the drag force.", "At a certain velocity, the drag force will be equal to the magnitude of the gravitational force,", "Hence, zero net force on the person, they will fall at this velocity with no acceleration – this is the terminal velocity."], "sec": "PM"}, {"id": "BE7", "m": 3, "q": "Explain how a racecar reaches terminal velocity.", "b": ["As a car accelerates forward due to Thrust, its velocity increases, which increases the drag force.", "At a certain velocity, the drag force will be equal to the magnitude of the Thrust force,", "Hence, zero net force on the car, they will travel at this velocity with no acceleration – this is the terminal velocity."], "sec": "PM"}, {"id": "BE8", "m": 2, "q": "Explain why air resistance reduces horizontal velocity.", "b": ["Air particles exert a force on the ball opposing its motion.", "Since 𝐹⃗ ∝ 𝑎⃗, air resistance causes horizontal acceleration in the opposite direction to the ball’s horizontal motion, which reduces horizontal velocity."], "sec": "PM"}, {"id": "BS1", "m": 2, "q": "State one benefit to a car owner and one benefit to the environment for reducing air resistance.", "b": ["Reducing air resistance allows the car to use less fuel to travel at any speed, which reduces expenses associated with fuel consumption.", "Reducing fuel consumption causes the car to emit fewer greenhouse gases and pollutants into the atmosphere."], "sec": "ST"}, {"id": "CE1", "m": 4, "q": "Use the Law of Conservation of Momentum to describe and explain how the reflection of particles of light (photons) can be used to accelerate a solar sail.", "b": ["Initially the photons travel toward the solar sail (forward) with momentum.", "When they reflect off the solar sail, their final momentum is in the opposite direction, so the change in momentum is backwards.", "Since the momentum is conserved in an isolated system (photon + solar sail), the solar sail must experience an equal magnitude of change in momentum, away from the photon.", "This change in momentum allows the solar sail to accelerate forward, away from the photon."], "sec": "PM"}, {"id": "CE2", "m": 4, "q": "Use the law of conservation of momentum to explain how the emission of xenon ions from an ion thruster can cause a spacecraft to accelerate.", "b": ["The ion thruster accelerates the xenon ions to the rear of the spacecraft.", "Thus, the xenon ions gain momentum in this direction. The ions and spacecraft form an isolated system.", "To conserve momentum, the spacecraft gains an equal magnitude of momentum in the opposite direction to the ions. The xenon ions are accelerated to the rear, so the spacecraft’s change in momentum is in its direction of motion. 𝑝", "Since 𝑣 = 𝑚 and the momentum of the spacecraft increases while its mass slightly decreases, the speed of the spacecraft increases, so it accelerates."], "sec": "PM"}, {"id": "CE3", "m": 3, "q": "Xenon ions have more than 10 times the mass of water molecules. Explain, with reference to Newton’s Second and Third Laws of Motion, why xenon ions are a more effective propellant than water molecules.", "b": ["If both propellants are accelerated to the same velocity, then since 𝐹 ∝ 𝑚 (Second Law), the force exerted by the spacecraft on the xenon ions is greater than the force exerted on the water molecules.", "By Newton’s Third Law, the force exerted by the xenon ions onto the spacecraft is greater than the force which the water molecules exert onto the spacecraft.", "Thus, since 𝐹 ∝ 𝑎, the spacecraft experiences a greater acceleration when propelled by xenon ions than water molecules."], "sec": "PM"}, {"id": "EE1", "m": 2, "q": "Explain how a banked curve reduces the reliance on friction to provide centripetal acceleration.", "b": ["A banked curve results in the normal force acting on a moving body being non- vertical. Thus, the normal force has non-zero horizontal and vertical components.", "The vertical component balances the weight of the body, while the horizontal component acts toward the centre of the moving body's circular path, supplying centripetal acceleration and enabling it to undergo uniform circular motion."], "sec": "CR"}, {"id": "EE2", "m": 1, "q": "Explain how it is possible for a moving body undergoing uniform circular motion to accelerate while moving at a constant speed.", "b": ["The moving body’s direction changes as it traverses the circular path, so its velocity also changes, since velocity has magnitude and direction. This results in 𝑣2 acceleration with magnitude 𝑎 = , directed towards the centre of the circular 𝑟 path."], "sec": "CR"}, {"id": "FE1", "m": 3, "q": "Explain that the gravitational forces are consistent with Newton’s Third Law.", "b": ["The force on each mass is directly proportional to the product of the two masses, so the force on the two masses are equal.", "The forces are attractive, so the forces on the two masses are exerted in the opposite direction.", "This is consistent with Newton's Third Law which states that the forces between two objects are of equal magnitude and are exerted in opposite directions."], "sec": "CR"}, {"id": "FE2", "m": 2, "q": "Explain why the centres of the circular orbits of Earth satellites must coincide with the centre of the Earth.", "b": ["The centripetal acceleration is supplied by the gravitational force of attraction exerted by Earth on the satellite, directed towards the centre of the Earth.", "Since centripetal acceleration is directed towards the centre of the satellite’s orbit, this must coincide with the centre of the Earth."], "sec": "CR"}, {"id": "FE3", "m": 2, "q": "Explain that the speed, and hence the period, of a satellite moving in a circular orbit depends only on the radius of the orbit and the mass of the central body about which the satellite is orbiting and not on the mass of the satellite.", "b": ["As the mass of the satellite increases, the magnitude of the gravitational force supplying centripetal acceleration proportionally increases.", "However, the magnitude of the force required for the satellite to undergo uniform circular motion also increases proportionally.", "Hence the orbital speed and period of the satellite are independent of its mass."], "sec": "CR"}, {"id": "FE4", "m": 3, "q": "The tangential speed of Earth changes in its orbit around the Sun. Use Kepler’s Second Law of Planetary Motion to explain why the tangential speed of Earth changes within its orbit.", "b": ["As per Kepler’s Second Law, Earth sweeps equal areas in equal time intervals.", "The radius vector drawn from the Sun has a shorter length when Earth is closer to the Sun. As such, Earth must travel a greater distance to sweep the same area compared to when Earth is further away.", "Hence, Earth travels a greater distance in the same time interval when closer to the Sun, meaning that its speed is faster when closer to the Sun."], "sec": "CR"}, {"id": "FE5", "m": 4, "q": "Explain why a satellite in a geostationary orbit must have an orbit in the Earth’s equatorial plane, with a relatively large radius and in the same direction as the Earth’s rotation.", "b": ["The centripetal acceleration is supplied by the gravitational force of attraction exerted by Earth on the satellite, so the centres of Earth and the satellite’s orbit must coincide.", "Geostationary satellites remain fixed above a single point on the equator, and hence must orbit in the same direction as the Earth’s rotation.", "Thus, the satellite must be above the equator, so is in the equatorial plane.", "The orbital period must equal 24 hours, the rotational period of Earth, which requires a relatively large radius of orbit by Kepler’s Third Law."], "sec": "CR"}, {"id": "FE6", "m": 3, "q": "Explain three reasons why low-altitude polar orbits are used for weather and surveillance.", "b": ["Since low-altitude polar orbits are relatively close to Earth, they can take high resolution images of Earth.", "Furthermore, they have short orbital periods which enables multiple orbits of Earth to be completed each day, allowing for regular monitoring.", "They also can view almost every location on Earth over many orbits, allowing for global coverage."], "sec": "CR"}, {"id": "FE7", "m": 2, "q": "Explain two applications of geostationary orbits.", "b": ["Geostationary satellites remain over one fixed point on the equator which enables continuous monitoring of weather patterns across a hemisphere.", "Additionally, the fixed position of geostationary satellites relative to Earth allows for fixed antennae to be erected on the ground, directed at the satellite, to transmit and receive communications."], "sec": "CR"}, {"id": "FE8", "m": 1, "q": "Explain one application of equatorial orbits.", "b": ["Equatorial orbits are used for communications in tropical and equatorial regions. They stay in Earth’s equatorial plane but can be at lower altitudes than geostationary orbits, passing equatorial regions more frequently with faster transmission times."], "sec": "CR"}, {"id": "FE9", "m": 2, "q": "State two differences between geostationary and polar orbits.", "b": ["Geostationary satellites remain over one fixed point on the equator while polar orbits view almost every location on Earth.", "A geostationary orbit lies in Earth’s equatorial plane while polar orbits go near Earth’s poles."], "sec": "CR"}, {"id": "FE10", "m": 2, "q": "Explain the advantage of launching a low-altitude equatorial-orbit satellite in a west-to-east direction.", "b": ["Earth rotates in a west-to-east direction, so this motion helps the satellite accelerate to its necessary orbital speed.", "Thus, less fuel and energy is required to accelerate the satellite to orbital speed."], "sec": "CR"}, {"id": "FS1", "m": 1, "q": "State Newton’s Law of Universal Gravitation in words.", "b": ["The gravitational force between two objects is an attractive force that is directly proportional to the product of their masses, and inversely proportional to the square of the distance between their centres."], "sec": "ST"}, {"id": "FS2", "m": 2, "q": "Define a gravitational field, and gravitational field strength.", "b": ["A gravitational field is a region of space surrounding a mass in which other masses experience a gravitational force.", "Gravitational field strength is the net gravitational force per unit mass at a given position in a gravitational field."], "sec": "ST"}, {"id": "FS3", "m": 3, "q": "State Kepler’s Three Laws of Planetary Motion.", "b": ["Kepler’s First Law of Planetary Motion: All planets move in elliptical orbits with the Sun at one focus.", "Kepler’s Second Law of Planetary Motion: The radius vector drawn from the Sun to a planet sweeps equal areas in equal time intervals.", "Kepler’s Third Law of Planetary Motion: The square of the orbital period of a satellite is directly proportional to the cube of its orbital radius."], "sec": "ST"}, {"id": "GE1", "m": 1, "q": "Explain the effects of time dilation on objects moving at relativistic speeds.", "b": ["When an object travelling at relativistic speeds is observed by an observer in a stationary reference frame, the observer may detect that the time it takes to travel between two points is longer (dilated), than it is, as experienced by an individual in the moving reference frame of the object."], "sec": "CR"}, {"id": "GE2", "m": 1, "q": "Explain the effects of length contraction on objects moving at relativistic speeds.", "b": ["When an object travelling at relativistic speeds is observed by an observer in a stationary reference frame, the observer may measure the object's length to be shorter (contracted) than it is when measured by an individual in the moving reference frame of the object."], "sec": "CR"}, {"id": "GE3", "m": 2, "q": "Explain why masses moving at relativistic speeds are unable to reach the speed of light.", "b": ["As an object’s speed approaches the speed of light, the Lorentz factor approaches infinity. As the Lorentz factor approaches infinity, the object’s relativistic momentum approaches infinity.", "To have infinite momentum, an infinite amount of force must be exerted on the object, which is physically impossible."], "sec": "CR"}, {"id": "GE4", "m": 3, "q": "Protons are collided to produce particles called kaons. In its moving frame of reference it can travel 3.68 m before decaying. However, scientists detect kaon particles more than 50 m from the collisions that produce them. Explain why it is possible for kaon particles to travel more than 50 m and be detected by scientists.", "b": ["The kaon is at rest in its reference frame and the laboratory is travelling at a very high speed.", "Hence, the lifetime of the kaon is dilated (larger) when measured by observers or detectors in the laboratory in their reference frame.", "The larger lifetime allows a kaon to travel a greater distance before decaying."], "sec": "CR"}, {"id": "GE5", "m": 3, "q": "An electron moves parallel to a straight conductor, at the same speed as the electrons in the conductor. The electron experiences a magnetic force due to the conductor. The positive ions in the conductor are at rest. Use the concept of relativistic length contraction to explain the force exerted on the electron in the reference frame where it is at rest.", "b": ["The electron is at rest in this reference frame, so there is no magnetic force on the electron.", "However, the positive ions are moving in this reference frame, and have a slightly higher density than electrons in the conductor due to relativistic length contraction.", "Thus, there is a net positive charge in the conductor, resulting in an attractive electrostatic force exerted on the electron. 𝒗𝟐"], "sec": "CR"}, {"id": "IE1", "m": 3, "q": "Describe how electric forces are consistent with Newton’s Third Law.", "b": ["The force on each charge is directly proportional to the product of the two charges, so the force on the two charges are equal.", "Electric forces are attractive or repulsive, and either way the forces on the two charges are exerted in opposite directions.", "This is consistent with Newton's Third Law which states that the forces between two objects are of equal magnitude and are exerted in opposite directions."], "sec": "EF"}, {"id": "IE2", "m": 3, "q": "Explain how the electric field near sharp points of a conductor can ionise the air.", "b": ["Charge density is highest near sharp points in conductors. This generates a strong local electric field.", "This electric field can be strong enough to polarise air molecules, and then remove a valence electron from them, ionising them.", "These free-flowing electrons are accelerated by the electric field, and can ionise other air molecules through collisions."], "sec": "EF"}, {"id": "IE3", "m": 3, "q": "Describe the motion of charged particles in a uniform electric field between parallel plates.", "b": ["The uniform electric field is directed from the positive to the negative plate. The electric force on a positively charged particle is in this direction, and on a negatively charged particle is in the opposite direction.", "Either way, the force is only in the vertical direction, so the vertical component of velocity increases due to vertical acceleration.", "However, the independent horizontal component of velocity remains constant since there is no horizontal acceleration, which results in the charged particle following a parabolic trajectory."], "sec": "EF"}, {"id": "IE4", "m": 2, "q": "Describe how an electric field between the dees can transfer energy and increase the speed of a charged particle passing between them.", "b": ["The electric field between the dees does positive work on the charged particle (𝑊 = 𝑞∆𝑉) as the alternating potential difference ensures that electric force is always parallel to velocity.", "Due to the Law of Conservation of Energy (𝑊 = ∆𝐸𝑘 ), the kinetic energy of the charged particle increases, which results in increased speed as 𝐸𝑘 ∝ 𝑣 2 ."], "sec": "EF"}, {"id": "IE5", "m": 3, "q": "Describe how charged particles can be accelerated to high energies when repeatedly move across the electric field between the dees.", "b": ["The electric field between the dees does positive work on the charged particle (𝑊 = 𝑞∆𝑉) as the alternating potential difference ensures that electric force is always parallel to velocity.", "Due to the Law of Conservation of Energy (𝑊 = ∆𝐸𝑘 ), the kinetic energy of the charged particle increases because of this", "The magnetic fields within the dees repeatedly steer the ions back towards the electric field in a uniform circular path, enabling the charged particle to reach high energies through many crossings."], "sec": "EF"}, {"id": "IE6", "m": 3, "q": "Explain why charged particles do not gain kinetic energy when inside the dees.", "b": ["The dees are hollow conductors with zero internal electric field.", "There is a uniform magnetic field inside the dees which exerts a magnetic force on the charged particle, perpendicular to its velocity and the magnetic field.", "There is no force parallel to the direction of velocity, so the speed and hence the 1 kinetic energy remains constant as 𝐸𝑘 = 2 𝑚𝑣 2 ."], "sec": "EF"}, {"id": "IE7", "m": 2, "q": "Describe and explain electrostatic equilibrium.", "b": ["Excess charge is distributed on the surface of the conductor such that the repulsion with neighbouring charges is minimised.", "In this state, the charged occupy fixed positions on the surface of the conductor and do not move."], "sec": "EF"}, {"id": "IE8", "m": 2, "q": "Explain why the component of the electric field parallel to a hollow conductor is zero.", "b": ["If there was a component of the electric field parallel to the conductor, the charges would accelerate in that direction.", "This is not possible since the charges are in electrostatic equilibrium on the surface of the conductor, where they occupy fixed positions."], "sec": "EF"}, {"id": "IE9", "m": 3, "q": "Explain how corona wires are used in a printer to transfer printer toner from the photoconductive surface to the paper.", "b": ["The strong electric field around the corona wire accelerates free moving electrons, which causes ionisation of air molecules through collisions.", "These new ions and electrons are then accelerated by the field. The particles with the same charge as the corona wire repel from the wire and hence collide with the paper.", "The toner has the opposite charge to the corona wire, and thus is forced onto the charged paper due to electrostatic attraction, as the paper has a larger magnitude of charge than the photoconductive surface."], "sec": "EF"}, {"id": "IE10", "m": 2, "q": "Explain how corona discharge is used to make dust particles negatively charged.", "b": ["The electric field between the parallel plates polarises and then ionises air molecules, removing a valence electron from them.", "These free-flowing electrons are accelerated onto the dust particles by the electric field."], "sec": "EF"}, {"id": "IE11", "m": 2, "q": "Explain why it is necessary for the electric field to continuously reverse direction.", "b": ["The electric field must exert an electric force in the ion’s direction of motion so that it accelerates rather than decelerates.", "In each subsequent crossing of the dees, the gap is entered from the opposite side, so the ion travels in the opposite direction. Thus, the electric field must reverse direction between each crossing."], "sec": "EF"}, {"id": "IE12", "m": 3, "q": "Explain why there is no electric field outside infinite parallel plates with the same magnitude of charge.", "b": ["The positive plate generates an electric field of constant magnitude, perpendicular to and away from the plate.", "The negative plate generates an electric field of constant magnitude, perpendicular to and towards the plate.", "The electric field due to these two plates are directed in opposite directions at any point outside the plates, so the net electric field is zero."], "sec": "EF"}, {"id": "IE13", "m": 2, "q": "Describe how corona discharge allows charge to be removed from an aircraft.", "b": ["Corona discharge ionises the insulating air around the wick, producing a conductive path of positive ions and free electrons.", "The electric force on electrons in the aircraft due to the electric field is directed away from the aircraft, so this conductive path allows for charge to be transferred from the aircraft to the surrounding air."], "sec": "EF"}, {"id": "IS1", "m": 2, "q": "Define an electric field, and electric field strength.", "b": ["An electric field is a region of space surrounding a charge in which other charges experience an electric force.", "Electric field strength is the net electric force per unit charge at a given position in an electric field."], "sec": "ST"}, {"id": "IS2", "m": 1, "q": "Define potential difference.", "b": ["Potential difference is the work done per unit charge in moving a positive charge between two points."], "sec": "ST"}, {"id": "IS3", "m": 1, "q": "State Coulomb’s Law.", "b": ["There is a mutual electrostatic force of attraction between opposite charges, and repulsion between like charges.", "The electrostatic force is directly proportional to the product of the charges.", "It is also inversely proportional to the square of the distance between the charges."], "sec": "ST"}, {"id": "JE1", "m": 3, "q": "Describe the motion of a charged particle in a uniform magnetic field.", "b": ["The uniform magnetic field exerts a magnetic force on the charged particle, perpendicular to its velocity and the magnetic field.", "Since there is no force parallel to velocity, the speed of the particle is unchanged, and only the direction changes.", "The magnetic force provides centripetal acceleration of constant magnitude which enables the charged particle to undergo uniform circular motion in the magnetic field."], "sec": "MF"}, {"id": "JE2", "m": 2, "q": "Describe the purpose of the magnetic field inside the dees of the cyclotron.", "b": ["The uniform magnetic field exerts a magnetic force on the charged particle, perpendicular to its velocity and the magnetic field.", "This provides centripetal acceleration which enables the charged particle to undergo uniform circular motion in the magnetic field, steering it towards the electric field where it gains speed and kinetic energy."], "sec": "MF"}, {"id": "JE3", "m": 4, "q": "Explain why protons must be accelerated to high speeds to produce a radioisotope.", "b": ["For the proton and target nucleus to collide, they must get extremely close to each other as the strong nuclear force, which fuses nuclei together, only acts over tiny distances.", "There is a repulsive force between the positively charged proton and target nucleus, which becomes stronger as they get closer.", "Thus, negative work is done on the proton as it moves towards the target nucleus which significantly reduces the proton’s kinetic energy as per the Law of Conservation of Energy 𝑊 = ∆𝐸𝑘 .", "As 𝐸𝑘 ∝ 𝑣 2 , this means that a high speed is required for the proton to have sufficient kinetic energy for a collision."], "sec": "MF"}, {"id": "JE4", "m": 3, "q": "Explain why the final kinetic energy of a given charged particle is independent of the potential difference across the dees.", "b": ["As the potential difference increases, more work is done on the charged particle per pass, resulting in a greater increase in kinetic energy and speed.", "However, this also increases the radius of the charged particle’s circular paths between the dees.", "Thus, the charged particle completes less revolutions before exiting, which offsets the kinetic energy per pass being greater."], "sec": "MF"}, {"id": "JE5", "m": 2, "q": "Explain the effect of the radius of the cyclotron on the final kinetic energy of a charged particle in a cyclotron.", "b": ["As the radius of the cyclotron increases, the number of revolutions of the charged particle increases.", "This increases the number of times it crosses the gap between the dees, thus increasing the amount of kinetic energy gained, leading to a higher final kinetic energy."], "sec": "MF"}, {"id": "JE6", "m": 3, "q": "Explain the effect of magnetic field strength on the final kinetic energy of a charged particle in a cyclotron.", "b": ["As the magnetic field strength increases, the radius of the charged particle’s 𝑚𝑣 1 circular paths between the dees decrease as 𝑟 = ⇒𝑟∝ . 𝑞𝐵 𝐵", "Thus, the number of revolutions completed by the charged particle before exiting increases.", "This increases the number of times it crosses the gap between the dees, thus increasing the amount of kinetic energy gained, leading to a higher final kinetic energy."], "sec": "MF"}, {"id": "JE7", "m": 2, "q": "Explain why the kinetic energy of a particle in a uniform magnetic field remains constant.", "b": ["The magnetic force is perpendicular to the velocity of the particle, so there is no component of force parallel to velocity", "Hence, there is no acceleration in the direction of motion, resulting in a constant 1 speed and thus kinetic energy as 𝐸𝑘 = 2 𝑚𝑣 2 ."], "sec": "MF"}, {"id": "JE8", "m": 3, "q": "Explain why a cyclotron must be evacuated before use.", "b": ["Any particles other than those being accelerated could collide with the particles being accelerated.", "These collisions would reduce the speed and kinetic energy of the accelerated particles, which is undesirable.", "An evacuated cyclotron allows for a constant period of circular motion of the particles, enabling synchronisation with a potential difference alternating at a constant frequency."], "sec": "MF"}, {"id": "JE9", "m": 2, "q": "The period of the circular motion of a particle in a cyclotron is independent of its speed. Explain why this is important for the operation of a cyclotron.", "b": ["A constant period ensures that the operating frequency 𝑓 = 𝑇 remains constant.", "This allows particles to be accelerated continuously with a potential difference alternating at a constant frequency."], "sec": "MF"}, {"id": "JE10", "m": 3, "q": "Describe the nature and direction of the magnetic field needed to deflect ions in a circular path in the dees of a cyclotron.", "b": ["The field must be uniform across the entire area of the dees.", "It must be directed perpendicular to the plane of the dees.", "Thus, the speed of the particle is unchanged but the direction of the particle changes due to uniform circular motion."], "sec": "MF"}, {"id": "JE11", "m": 3, "q": "Explain how a moving coil loudspeaker produces a sound wave with the input signal from an oscillator.", "b": ["The oscillating input signal causes the current in the coil to change direction at a constant frequency.", "The magnetic field between the permanent magnets produces a force on the coil which changes direction at the same frequency.", "As the voice coil is attached to the cone, it moves back and forth with the same frequency as the coil due to the magnetic force, which produces a sound wave with the same frequency as the input signal."], "sec": "MF"}, {"id": "JE12", "m": 2, "q": "Explain why the period of circular motion in a cyclotron is independent of the radius.", "b": ["An increase in radius results in a proportional increase in the speed as 𝑟 = 𝑞𝐵 ⇒ 𝑟 ∝ 𝑣.", "It also results in a proportional increase in the length of the circular path (2𝜋𝑟), which means the time taken to complete the circular path is the same."], "sec": "MF"}, {"id": "KE1", "m": 3, "q": "Explain how Lenz’s Law is consistent with the Law of Conservation of Energy.", "b": ["When the magnetic flux through a conductor changes, an electromotive force is induced as per Faraday’s Law.", "The direction of induced current generated from the electromotive force is such that the induced magnetic field opposes the change in magnetic flux as per Lenz’s Law.", "The work done by the object producing the changing flux to overcome the force from the induced magnetic field is equal to the gain in electrical and thermal energy in the form of heat and current flow in the conductor. Thus, total energy is conserved."], "sec": "EI"}, {"id": "KE2", "m": 3, "q": "Use Lenz’s Law to explain the production of eddy currents when the magnetic field strength changes.", "b": ["As the magnetic field strength at the position of the conductor changes, the magnetic flux through the conductor changes.", "As per Faraday’s Law, this induces an electromotive force which causes circular loops of current (eddy currents) to flow within the body of the conductor.", "As per Lenz’s Law, they move in a direction that creates a magnetic field opposing the change in magnetic flux that produced them."], "sec": "EI"}, {"id": "KE3", "m": 4, "q": "Explain how generators can be used to produce an alternating electric current.", "b": ["A generator contains coils that rotate through a uniform magnetic field produced by electromagnets.", "The coil experiences a change in magnetic flux as it rotates, inducing an electromotive force and current flow in the coil as per Faraday’s Law.", "The direction of the current flow reverses every half-revolution, since the sides of the coil reverse their direction of motion relative to the magnetic field.", "This alternating current is transferred to an external circuit via slip rings."], "sec": "EI"}, {"id": "KE4", "m": 3, "q": "Describe the purpose of transformers in electric circuits.", "b": ["Step-up transformers increase voltage, while step-down transformers decrease voltage in a circuit.", "Step-up transformers are applied in long range transmission to increase voltage 𝑃 and thus reduce current as 𝐼 = , which reduces the power dissipated as heat 𝑉 (𝑃 = 𝐼 2 𝑅).", "Step-down transformers are applied in households to reduce the mains voltage to lower amounts which are safer for humans."], "sec": "EI"}, {"id": "KE5", "m": 3, "q": "Explain how the number of turns in a transformer affects its output potential difference.", "b": ["As per Faraday’s Law, the number of turns in a coil is directly proportional to the electromotive force induced by the coil.", "Thus, if the primary coil has more turns than the secondary coil, the output potential difference is smaller.", "Conversely, if the secondary coil has more turns, the output potential difference is larger."], "sec": "EI"}, {"id": "KE6", "m": 3, "q": "Two identical bar magnets are dropped from the same height above Earth’s surface. Bar magnet 1 passes through a loop of wire. Explain why magnet 2 hits the ground first.", "b": ["As Magnet 1 moves towards the wire, the magnetic field strength of the magnet at the position of the wire increases, which increases the magnetic flux through the wire. This induces an electromotive force and current in the wire as per Faraday’s Law.", "As per Lenz’s Law, the induced current in the loop is such that the magnetic field created by the wire opposes the motion of Magnet 1. This results in a magnetic force that reduces the magnitude of Magnet 1’s vertical acceleration.", "The only force on Magnet 2 is gravity, so since it doesn’t experience an opposing magnetic force, it hits the ground first."], "sec": "EI"}, {"id": "KE7", "m": 2, "q": "Explain why transformers use alternating current rather than direct current to change voltages.", "b": ["Alternating current produces a magnetic field that changes with time while direct current does not.", "The changing magnetic field produces a changing magnetic flux that induces an electromotive force and electric current in the secondary coil as per Faraday’s Law."], "sec": "EI"}, {"id": "KE8", "m": 2, "q": "Explain the production of an emf in the coil of a credit card reader.", "b": ["As the magnetic stripe on the credit card moves, the magnetic field strength of the stripe at the position of the coil changes. Thus, the magnetic flux through the coil changes.", "As per Faraday’s Law, this change in magnetic flux induces an emf in the coil."], "sec": "EI"}, {"id": "KE9", "m": 3, "q": "Explain how sound waves in a dynamic microphone are transferred into oscillating electrical signals.", "b": ["The sound waves cause the coil to oscillate at the frequency of the sound wave. This oscillation moves the coil closer and further from the magnet, changing the magnetic field strength of the magnet at the position of the coil.", "Hence, the magnetic flux through the coil changes. As per Faraday's Law, this induces an emf in the coil, which produces current.", "As per Lenz's Law, the current produces a magnetic field that opposes the change in magnetic flux, meaning the current changes direction due to the coil’s direction of movement changing."], "sec": "EI"}, {"id": "KS1", "m": 2, "q": "Define electromotive force and electromagnetic induction.", "b": ["An electromotive force is a potential difference induced in a conductor that is exposed to a changing magnetic flux.", "Electromagnetic induction is the process in which a changing magnetic flux induces an electromotive force and current flow in a conductor."], "sec": "ST"}, {"id": "KS2", "m": 1, "q": "Define magnetic flux.", "b": ["The number of magnetic field lines passing perpendicularly through a given area, given by the product of the magnetic field strength and the area perpendicular to the magnetic field."], "sec": "ST"}, {"id": "KS3", "m": 1, "q": "State Lenz’s Law.", "b": ["The electromotive force induced by a changing magnetic flux generates a current such that the direction of the induced magnetic field opposes the change in magnetic flux."], "sec": "ST"}, {"id": "KS4", "m": 1, "q": "State Faraday’s Law of Electromagnetic Induction.", "b": ["The electromotive force induced in a conductor is directly proportional to the rate of change of magnetic flux passing through the coils of the conductor."], "sec": "ST"}, {"id": "KS5", "m": 2, "q": "State two reasons why the energy transfer between the primary and secondary coils is not 100% efficient.", "b": ["Eddy currents in the core generate heat due to resistance by the core material.", "Eddy currents in the core produce an unwanted magnetic flux that opposes the flux from the primary coil. 𝒒 ⃗⃗⃗ = 𝒌 𝟐 for electric field strength. [2]"], "sec": "ST"}, {"id": "ME1", "m": 3, "q": "Use the frequency of oscillation of the electrons in the transmitting and receiving antennae to explain the transmission and reception of radio or television signals.", "b": ["As electrons in the transmitting antenna oscillate, they generate an oscillating electric field, which generates a perpendicular oscillating magnetic field.", "These oscillating fields constantly reproduce each other as the EM wave propagates away from the antenna at the speed of light.", "In a receiving antenna, the oscillating electric field vector in an incident EM wave exerts an oscillating electric force on free electrons (𝐹 = 𝐸𝑞), which causes them to oscillate at the frequency of the wave, enabling the reception of the signal."], "sec": "WB"}, {"id": "ME2", "m": 2, "q": "Describe and explain the orientation of the receiving antenna in relation to the plane of polarisation of incident electromagnetic waves.", "b": ["The oscillating electric field exerts an oscillating electric force (𝐹 = 𝐸𝑞) on free electrons in the receiving antennae, in the direction of the plane of polarisation.", "If the receiving antenna is not parallel to this plane, then the electrons cannot be fully pushed up and down the rod. Thus, maximum reception occurs when it is parallel."], "sec": "WB"}, {"id": "ME3", "m": 2, "q": "Explain why the transmissions from radio towers in rural areas are polarised at right angles to transmissions from towers in the city.", "b": ["When the planes of polarisation of two waves are perpendicular, there is no component of one electric field parallel to the other electric field, resulting in no interference.", "Thus, rural transmissions are polarised at right angles to city transmissions to prevent interference which occurs at angles less than 90 degrees, resulting in signal loss."], "sec": "WB"}, {"id": "ME4", "m": 2, "q": "Explain why light from an incandescent source is neither coherent nor monochromatic.", "b": ["Electrons in the filament vibrate with different phase relationships, so they emit light in random directions with random, changing phase relationships. Hence, it is not coherent.", "Atoms in the filament vibrate with a range of frequencies, so they emit light of a range of frequencies. Hence, it is not monochromatic."], "sec": "WB"}, {"id": "ME5", "m": 2, "q": "Explain why a helium lamp produces incoherent light", "b": ["Electrons in excited helium atoms randomly transition from higher to lower energy levels, emitting a photon with energy equal to the difference of the two energy levels.", "The photons produced travel in a random direction with random, changing phase relationships. Hence, it is not coherent."], "sec": "WB"}, {"id": "ME6", "m": 2, "q": "Explain how interference can produce waves with maximum and minimum amplitudes.", "b": ["When two waves interfere in phase, constructive interference occurs. The resultant wave’s amplitude is the sum of the individual amplitudes (maximum).", "When two waves interfere out of phase, destructive interference occurs. If the phase difference is 180 degrees, the amplitude is the difference of the individual amplitudes (minimum)."], "sec": "WB"}, {"id": "ME7", "m": 4, "q": "Describe and explain the production of a two-slit interference pattern using coherent light.", "b": ["When a coherent light source is shone into the two slits, each slit acts as an individual coherent light source. Thus, waves diffract at the slits and move towards the screen with a constant phase relationship.", "When light waves converge on the screen with a path difference equal to an integer multiple of wavelength, they constructively interfere, producing a resultant wave of maximum amplitude which creates a bright fringe on the screen.", "When light waves converge on the screen with a path difference equal to a half- integral multiple of wavelength, they destructively interfere, producing a resultant wave of zero amplitude which creates a dark fringe on the screen.", "Interference produces approximately equally spaced, alternating bright and dark fringes on the screen."], "sec": "WB"}, {"id": "ME8", "m": 2, "q": "Describe how the diffraction of the light by the slits in a two-slit interference apparatus allows the light to interfere.", "b": ["The width of the slits is comparable to the wavelength of light passing through, causing the waves to diffract and spread out in all directions.", "This leads the waves to overlap and interfere with each other, thus converging at different points on the screen. Bright fringes indicate regions of constructive interference, while dark fringes indicate regions of destructive interference."], "sec": "WB"}, {"id": "ME9", "m": 2, "q": "Describe how a single slit apparatus is used when incoherent light is used in a double-slit experiment.", "b": ["The single slit acts as a point source of light. Light diffracts at the slit, creating a single localised wavefront.", "The double slits are positioned equidistant from the single slit, so the wavefront reaches both slits simultaneously. Thus, the emanated waves maintain a constant phase relationship."], "sec": "WB"}, {"id": "ME10", "m": 3, "q": "Describe how diffraction by the very thin slits in a grating allows the light from the slits to overlap and hence interfere to produce significant intensity maxima at large angles.", "b": ["Diffraction gratings contain thin slits, causing significant diffraction of light. Thus, the waves spread out at large angles.", "When the path difference between waves from all slits is equal to an integer multiple of wavelength, they interfere constructively, creating high intensity fringes since there are many slits and thus many waves.", "At other points, waves from far apart slits with path difference equal to a half- integral multiple of wavelength interfere destructively in pairs, leading to large dark minima."], "sec": "WB"}, {"id": "ME11", "m": 3, "q": "Explain the negligible intensity between the maxima in the interference pattern produced by a transmission diffraction grating.", "b": ["At points in between maxima, light waves from adjacent slits converge with path difference not equal to an integer multiple of wavelength.", "Consider a fixed slit on the grating. Waves from slits further from the fixed slit converge with a larger path difference. Eventually, the path difference is half- integral multiple of wavelength.", "Thus, waves from far apart slits interfere destructively producing a resultant wave of negligible intensity."], "sec": "WB"}, {"id": "ME12", "m": 3, "q": "Describe how a diffraction grating can be used to experimentally determine the wavelength of light from a monochromatic source.", "b": ["When light is shone onto the diffraction grating, the light undergoes diffraction and produces high intensity bright fringes at large angles. A spectroscope can be rotated until the first order maxima is visible, to find the angle 𝜃 between the central and first order maxima. 10−3", "The slit separation 𝑑 in metres can be found with 𝑑 = where 𝑁 is the number 𝑁 of lines per millimetre on the diffraction grating.", "Then, the wavelength can be calculated using 𝑚𝜆 = 𝑑 sin 𝜃 where 𝑚 = 1. The effect of random error can be reduced by repeating this procedure with larger values of 𝑚 and taking the average."], "sec": "WB"}, {"id": "ME13", "m": 2, "q": "Identify the properties of a transmission diffraction grating that make it useful in spectroscopy.", "b": ["They have small slit separation and thus produce maxima with large angular spread.", "Additionally, they produce narrow and sharp high intensity bright fringes due to the large quantity of slits. This increases the accuracy of wavelength measurements through spectral lines."], "sec": "WB"}, {"id": "ME14", "m": 3, "q": "Describe and explain the white light pattern produced by a diffraction grating.", "b": ["White light is composed of waves of all the visible frequencies of light.", "Hence, when white light is shone into a diffraction grating, the central maxima is white, as the path difference is zero for each pair of slits equidistant from the centre, resulting in all frequencies recombining constructively.", "At all spectral orders, a continuous spectrum is observed, with lower wavelength violet light having the smallest angular spread and higher wavelength red light having the largest angular spread since 𝜆 ∝ sin 𝜃. Adjacent spectral orders overlap with each other."], "sec": "WB"}, {"id": "ME15", "m": 2, "q": "Explain why the two slits need to be coherent wave sources for observable interference to occur.", "b": ["Coherent light has a constant phase relationship and thus produces a stationary interference pattern.", "Incoherent light would produce a constantly changing interference pattern which cannot be observed with the human eye."], "sec": "WB"}, {"id": "ME16", "m": 2, "q": "Explain why a diffraction grating with 𝒅 < 𝝀 cannot be used to find the wavelength of a monochromatic light source.", "b": ["For there to be a first order maxima, the equation 𝑑 sin 𝜃 = 𝜆 must have a solution. As 𝑑 < 𝜆 and sin 𝜃 ≤ 1, there is no solution, so the central maxima is the only visible maxima.", "Hence, the fringe separation cannot be experimentally determined, which means that the wavelength of the light cannot be found."], "sec": "WB"}, {"id": "ME17", "m": 4, "q": "Explain how the interference of light is used to read information from a compact disc.", "b": ["A disc player uses coherent light beam of wavelength λ to read the disc. The disc contains flat lands and flat pits of depth approx. λ/4.", "When a light beam passes through a flat region, the path differences are zero, resulting in constructive interference.", "When a light beam passes in between a land and the pit, light that reflects off a pit has approx. λ/2 path difference from light that does not, causing destructive interference.", "The variation in light intensity is used to read information."], "sec": "WB"}, {"id": "MS1", "m": 3, "q": "Describe an electromagnetic wave travelling in a vacuum.", "b": ["An electromagnetic wave consists of mutually perpendicular, oscillating electric and magnetic fields.", "These electric and magnetic fields oscillate perpendicular to each other, and also both oscillate perpendicular to the direction of wave propagation.", "An electromagnetic wave propagates at the speed of light (3.00 x 10^8 m/s)."], "sec": "ST"}, {"id": "MS2", "m": 2, "q": "Describe the difference between polarised and unpolarised light.", "b": ["Polarised light consists of EM waves with a single, common plane of polarisation.", "Unpolarised light consists of EM waves with many different planes of polarisation."], "sec": "ST"}, {"id": "MS3", "m": 2, "q": "State two similarities and two differences between different electromagnetic waves.", "b": ["Similarities: Speed in a vacuum, transverse nature of the waves.", "Differences: Frequency of the waves, wavelength of the waves."], "sec": "ST"}, {"id": "MS4", "m": 1, "q": "Define a plane-polarised electromagnetic wave.", "b": ["A plane-polarised EM wave has an electric field that oscillates within a single fixed plane."], "sec": "ST"}, {"id": "MS5", "m": 2, "q": "Describe what is meant by wave sources being in phase and out of phase.", "b": ["Two wave sources are in phase if both sources emit a crest at the same time and a trough at the same time.", "Two wave sources are out of phase if they emit crests and troughs at different times."], "sec": "ST"}, {"id": "MS6", "m": 2, "q": "Define coherent and monochromatic wave sources.", "b": ["A coherent light source emits waves that maintain a constant phase relationship.", "A monochromatic light source emits waves of a single frequency."], "sec": "ST"}, {"id": "MS7", "m": 2, "q": "State four differences between the interference pattern produced by two slits and a diffraction grating.", "b": ["Diffraction grating produces fringes with smaller width and higher light intensity (brighter). It also produces an interference pattern with a larger angular spread.", "The fringe separation of maxima is not constant in a diffraction grating pattern while being approximately constant in a two slit interference pattern."], "sec": "ST"}, {"id": "MS8", "m": 1, "q": "State two differences in the interference pattern produced by light of a longer wavelength.", "b": ["There is a larger angular spread between maxima, and the colour of the light is different."], "sec": "ST"}, {"id": "NE1", "m": 2, "q": "Explain why the current in a photoelectric circuit decreases as the stopping voltage is increased.", "b": ["Increasing the stopping voltage produces an electric field such that the electric force opposes the flow of electrons from the cathode to the anode.", "Hence, fewer electrons reach the anode, which means the current in the circuit is reduced."], "sec": "WP"}, {"id": "NE2", "m": 2, "q": "State and explain the effect of increasing the intensity of light on the photoelectric current.", "b": ["Increasing the intensity of light results in more photons incident on the cathode per unit time, resulting in more photon-electron interactions where a photon transfers its energy to exactly one electron as per the Law of Conservation of Energy.", "This increases the rate of emission of electrons from the cathode, resulting in an increased photoelectric current."], "sec": "WP"}, {"id": "NE3", "m": 4, "q": "Describe an experimental method for investigating the relationship between the frequency of the monochromatic light and the maximum kinetic energy of the emitted electrons, calculated from the measured stopping voltage using 𝑬𝒌𝒎𝒂𝒙 = 𝒆𝑽𝒔 , and the frequency of the light incident on a metal surface.", "b": ["Use a photocell setup with an ammeter in series with the anode and a voltmeter in parallel with the variable power supply. Shine monochromatic light of known frequency onto the surface of the cathode.", "Gradually increase the voltage until the galvanometer reads 0 Amperes. Record this voltage, which is the stopping voltage.", "Using the formula 𝐸𝑘𝑚𝑎𝑥 = 𝑒𝑉𝑠 , calculate the maximum kinetic energy of the emitted electrons. Repeat this process with different monochromatic light sources of different frequencies.", "Then plot maximum kinetic energy against frequency and draw a trendline. The x- intercept is the experimental threshold frequency, the magnitude of the y- intercept is the experimental work function of the cathode, and the gradient is the experimental value for Planck’s constant."], "sec": "WP"}, {"id": "NE4", "m": 5, "q": "Describe how Einstein used the concept of photons and the conservation of energy to explain the experimental observations of the photoelectric effect.", "b": ["Einstein knew that photons were particles with energy 𝐸 = ℎ𝑓, and that electrons are bound in a metal by a potential energy barrier known as the work function (𝑊).", "As per the Law of Conservation of Energy, when a photon is incident on the surface of a metal, its energy is absorbed by an electron inside the metal via a one-to-one interaction.", "If ℎ𝑓 ≥ 𝑊, then sufficient energy can be transferred, so an electron may be released from the metal (photoelectric effect). Any excess energy is converted to kinetic energy of the emitted electron, with the maximum kinetic energy being ℎ𝑓 − 𝑊.", "Because emission requires ℎ𝑓 ≥ 𝑊, there is minimum frequency for emission. 𝑊 This is 𝑓0 = , which is called the threshold frequency. ℎ", "Furthermore, if the intensity of the light source is increased, more energy transfers between photons and electrons occur per unit time, increasing the rate of electron emission."], "sec": "WP"}, {"id": "NE5", "m": 5, "q": "Describe the purpose of the following features of a simple X-ray tube: filament, target, high-voltage supply, evacuated tube, cooling fins.", "b": ["The filament is the cathode. It contains a current which generates heat that causes the emission of electrons.", "The target is a heavy metal anode that is struck by the energetic electrons emitted from the cathode. These collisions convert their kinetic energy into X-ray photons.", "The high voltage power supply produces an electric field between the cathode and anode that accelerates electrons.", "The evacuated tube contains no air particles, or particles other than the electrons. This prevents electrons from losing kinetic energy due to collisions.", "The cooling fins prevent the target from overheating by dissipating the heat transferred from the electrons to the target during collisions."], "sec": "WP"}, {"id": "NE6", "m": 3, "q": "Describe and explain the production of X-rays in a simple X-ray tube.", "b": ["The filament is a cathode connected to a low-voltage power supply. Thus, current flows through the filament. The resistance in the filament generates heat which causes electrons from the filament to be emitted.", "The high-voltage power supply creates an electric field between the filament and target (cathode and anode), which accelerates the emitted electrons towards the target.", "When high energy electrons interact with target nuclei, they undergo varying amounts of deceleration depending on the nature of the collision, decreasing their kinetic energy. The lost kinetic energy of the electrons is converted into thermal energy and X-ray photons. The produced X-rays are emitted away from the target."], "sec": "WP"}, {"id": "NE7", "m": 3, "q": "Describe the energy changes that occur during the production of X-rays, including the heat produced.", "b": ["The electrons in the filament gain thermal energy from resistance in the filament, causing emission. The electrons are accelerated to high kinetic energies by the strong electric field between the cathode and the anode.", "When high energy electrons interact with target nuclei, they undergo varying amounts of deceleration depending on the nature of the collision, decreasing their kinetic energy.", "A large proportion (~99%) of the lost kinetic energy of the electrons is converted into thermal energy in the target, while the remainder of the lost energy is converted into X-ray photons via braking radiation and characteristic X-rays."], "sec": "WP"}, {"id": "NE8", "m": 3, "q": "Explain the continuous range of frequencies and the maximum frequency in the spectrum of the X-rays.", "b": ["When high energy electrons interact with target nuclei, they undergo varying amounts of deceleration depending on the nature of the collision, decreasing their kinetic energy. This results in the production of X-rays with different energies and thus frequencies as 𝐸 ∝ 𝑓.", "Low frequency photons are produced by electrons that are partially deflected by the nucleus, and mid frequency photons are produced by electrons that are strongly deflected.", "When a high energy electron collides directly with a target nucleus, the collision causes full deceleration, so an X-ray photon of maximum energy and frequency is produced."], "sec": "WP"}, {"id": "NE9", "m": 3, "q": "Describe the three main features of the X-ray spectrum.", "b": ["The electrons produce X-ray photons with a continuous range of energies, as the electrons undergo varying amounts of deceleration depending on the nature of their interaction with the target.", "The spectrum has peaks at frequencies of characteristic X-rays, produced when incident electrons ionise inner shell electrons from target atoms.", "The spectrum has a maximum energy, occurring when an electron collides directly with a target nucleus, decelerating completely to rest."], "sec": "WP"}, {"id": "NE10", "m": 2, "q": "Explain why hard X-rays are used to produce medical images of the human body.", "b": ["Hard X-rays consist of higher energy photons, which have greater penetrating power.", "This allows them to penetrate through soft tissue while being absorbed by dense tissue, producing images with clear contrast between tissues."], "sec": "WP"}, {"id": "NE11", "m": 2, "q": "Explain how X-rays can be used to detect tumours.", "b": ["Tumours are denser than surrounding tissue, so attenuates the X-rays more significantly.", "Hence, fewer X-rays in the region of the tumour reach the film, so the tumour shows up brighter than the surrounding tissue."], "sec": "WP"}, {"id": "NE12", "m": 3, "q": "Explain the effect of manipulating the potential difference across the X-ray tube on the X-ray spectrum and hardness of X-rays.", "b": ["Increasing the potential difference increases the strength of the electric field between the cathode and anode, causing electrons to be accelerated to higher energies. Thus, the energy of the X-rays produced is increased.", "Thus, there is more energy to be converted into X-ray photons, so as 𝐸 ∝ 𝑓, the frequency of the X-rays produced is increased, along with the maximum frequency.", "The higher energy X-rays have a higher penetrating power, so the hardness of the X-rays is increased."], "sec": "WP"}, {"id": "NE13", "m": 3, "q": "Explain the effect of the filament current on the intensity and exposure time of X-rays produced by an X-ray tube.", "b": ["Increasing the filament current increases the heat generated due to resistance in the filament, which increases the rate of emission of electrons from the filament.", "This increases the number of electrons accelerated by the electric field per unit time, which increases the rate of electron interaction with the target. This increases the rate of production of X-ray photons, which increases the intensity of the X-rays.", "Due to the increased intensity, the total number of photons needed for a clear image is accumulated in a shorter time interval, thereby reducing the required exposure time."], "sec": "WP"}, {"id": "NE14", "m": 4, "q": "State and explain three properties of materials which affect the attenuation of X-rays.", "b": ["Atomic number of the atoms in the material, Density of the material, Thickness of the material.", "Atoms with a greater atomic number have more electrons. There are more particles for X-rays to collide with, increasing attenuation.", "Denser materials have a greater quantity of atoms per unit volume. This leads to X-rays colliding with more particles, increasing attenuation.", "Thicker materials require penetration over a greater distance. X-rays collide with more particles over a greater distance, increasing attenuation."], "sec": "WP"}, {"id": "NE15", "m": 3, "q": "Describe the Davisson-Germer experiment, and explain how the results of the experiment demonstrated the wave behaviour of electrons.", "b": ["The Davisson-Germer experiment involved shining an electron beam into a nickel crystal. The electrons are reflected and scattered by the crystal. The intensity of the scattered electrons was measured for different angles between the source and the detector, with maxima and minima present at certain angles.", "The variation in electron intensity provides evidence for the wave behaviour of electrons, as maxima occur from constructive interference and minima occur from destructive interference, which are wave phenomena.", "In particular, X-rays with wavelength equal to the de Broglie wavelength of the electrons produce an equivalent interference pattern when shone through a crystal lattice with atomic spacing equal to the atomic spacing between the nickel atoms."], "sec": "WP"}, {"id": "NE16", "m": 4, "q": "Describe and explain the production of a two-slit interference pattern with an electron beams.", "b": ["The electrons exhibit wave behaviour, and thus the electron waves diffract through the slits and overlap with one another.", "When electron waves converge on the screen with a path difference equal to an integer multiple of wavelength, they constructively interfere, producing a resultant wave of maximum amplitude which creates a bright fringe on the screen.", "When electron waves converge on the screen with a path difference equal to a half-integral multiple of wavelength, they destructively interfere, producing a resultant wave of zero amplitude which creates a dark fringe on the screen.", "Interference produces approximately equally spaced, alternating bright and dark fringes on the screen."], "sec": "WP"}, {"id": "NE17", "m": 2, "q": "Explain how electron microscopes achieve higher resolutions than optical microscopes.", "b": ["High speed electrons used in electron microscopes have de Broglie wavelengths that are much smaller than the wavelengths of visible light.", "Hence, these electrons experience much less diffraction than visible light, allowing electron microscopes to achieve much higher resolutions than optical microscopes."], "sec": "WP"}, {"id": "NS1", "m": 1, "q": "Define the work function.", "b": ["The work function of a conducting material is the minimum ene
